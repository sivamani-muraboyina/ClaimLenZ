<svg width="680" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif; background: white;">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Documents input -->
<rect x="20" y="60" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="80" y="82" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Documents</text>
<text font-size="12" x="80" y="100" text-anchor="middle" dominant-baseline="central" fill="#534AB7">PDF + images</text>

<!-- pdfplumber -->
<rect x="20" y="160" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="80" y="180" text-anchor="middle" dominant-baseline="central" fill="#085041">pdfplumber</text>
<text font-size="12" x="80" y="198" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Raw text</text>
<line x1="80" y1="116" x2="80" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Claim form -->
<rect x="20" y="260" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="80" y="280" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Claim form</text>
<text font-size="12" x="80" y="298" text-anchor="middle" dominant-baseline="central" fill="#534AB7">member · date · ₹</text>

<!-- Stage 1 border -->
<rect x="168" y="30" width="200" height="310" rx="12" fill="none" stroke="#ddd" stroke-width="0.5" stroke-dasharray="5 4"/>
<text font-size="11" x="268" y="22" text-anchor="middle" fill="#bbb">Stage 1 — extraction</text>

<!-- Groq Stage 1 -->
<rect x="178" y="44" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="268" y="64" text-anchor="middle" dominant-baseline="central" fill="#633806">Groq · Llama 3.3 70B</text>
<text font-size="12" x="268" y="82" text-anchor="middle" dominant-baseline="central" fill="#854F0B">EXTRACTION_SYSTEM prompt</text>

<!-- Extracted fields -->
<rect x="178" y="120" width="180" height="200" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="268" y="142" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Extracted fields</text>
<text font-size="11" x="196" y="162" dominant-baseline="central" fill="#5F5E5A">doctor_name</text>
<text font-size="11" x="196" y="180" dominant-baseline="central" fill="#5F5E5A">doctor_reg_number</text>
<text font-size="11" x="196" y="198" dominant-baseline="central" fill="#5F5E5A">patient_name</text>
<text font-size="11" x="196" y="216" dominant-baseline="central" fill="#5F5E5A">diagnosis</text>
<text font-size="11" x="196" y="234" dominant-baseline="central" fill="#5F5E5A">medicines_prescribed</text>
<text font-size="11" x="196" y="252" dominant-baseline="central" fill="#5F5E5A">tests_prescribed</text>
<text font-size="11" x="196" y="270" dominant-baseline="central" fill="#5F5E5A">bill_total_amount</text>
<text font-size="11" x="196" y="288" dominant-baseline="central" fill="#5F5E5A">treatment_type + confidence</text>

<!-- Doc → Stage 1 -->
<line x1="140" y1="188" x2="178" y2="188" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Python regex -->
<rect x="178" y="344" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="268" y="364" text-anchor="middle" dominant-baseline="central" fill="#085041">Python regex check</text>
<text font-size="12" x="268" y="382" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Doctor reg → confidence 0 if fail</text>
<line x1="268" y1="320" x2="268" y2="344" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Stage 2 border -->
<rect x="396" y="30" width="200" height="310" rx="12" fill="none" stroke="#ddd" stroke-width="0.5" stroke-dasharray="5 4"/>
<text font-size="11" x="496" y="22" text-anchor="middle" fill="#bbb">Stage 2 — adjudication</text>

<!-- Groq Stage 2 -->
<rect x="406" y="44" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="496" y="64" text-anchor="middle" dominant-baseline="central" fill="#633806">Groq · Llama 3.3 70B</text>
<text font-size="12" x="496" y="82" text-anchor="middle" dominant-baseline="central" fill="#854F0B">DECISION_SYSTEM prompt</text>

<!-- Decision output -->
<rect x="406" y="120" width="180" height="200" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="496" y="142" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Decision output</text>
<text font-size="11" x="424" y="162" dominant-baseline="central" fill="#5F5E5A">decision</text>
<text font-size="11" x="424" y="180" dominant-baseline="central" fill="#5F5E5A">approved_amount</text>
<text font-size="11" x="424" y="198" dominant-baseline="central" fill="#5F5E5A">rejection_reasons</text>
<text font-size="11" x="424" y="216" dominant-baseline="central" fill="#5F5E5A">rejection_explainer</text>
<text font-size="11" x="424" y="234" dominant-baseline="central" fill="#5F5E5A">next_steps</text>
<text font-size="11" x="424" y="252" dominant-baseline="central" fill="#5F5E5A">partial_rejection_items</text>
<text font-size="11" x="424" y="270" dominant-baseline="central" fill="#5F5E5A">fraud_flags</text>
<text font-size="11" x="424" y="288" dominant-baseline="central" fill="#5F5E5A">confidence_score</text>

<!-- Stage 1 fields → Stage 2 -->
<path d="M358 372 L382 372 L382 188 L406 188" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="370" y="384" fill="#5F5E5A">fields</text>

<!-- Claim form → Stage 2 -->
<path d="M140 288 L382 288 L382 210 L406 210" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text font-size="11" x="270" y="280" text-anchor="middle" fill="#888">claim data</text>

<!-- Python override -->
<rect x="406" y="344" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="496" y="364" text-anchor="middle" dominant-baseline="central" fill="#085041">Python overrides</text>
<text font-size="12" x="496" y="382" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Cap · discount · co-pay</text>
<line x1="496" y1="320" x2="496" y2="344" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Final decision -->
<rect x="406" y="422" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="496" y="444" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Final decision card</text>
<line x1="496" y1="400" x2="496" y2="422" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
