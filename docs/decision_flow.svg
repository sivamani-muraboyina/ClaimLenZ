<text font-size="11" x="516" y="178" text-anchor="middle" fill="#A32D2D">yes</text>
<rect x="512" y="226" width="148" height="36" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text font-size="11" x="586" y="244" text-anchor="middle" dominant-baseline="central" fill="#791F1F">SERVICE_NOT_COVERED</text>
<line x1="340" y1="208" x2="340" y2="238" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="354" y="226" fill="#5F5E5A">no</text>

<!-- Check 3 -->
<rect x="200" y="238" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="256" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Within waiting period?</text>
<text font-size="12" x="340" y="272" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">30d general · 90d diabetes/HTN…</text>
<path d="M480 260 L556 260 L556 302" fill="none" stroke="#e24b4a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
<text font-size="11" x="516" y="252" text-anchor="middle" fill="#A32D2D">yes</text>
<rect x="512" y="302" width="148" height="36" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text font-size="11" x="586" y="320" text-anchor="middle" dominant-baseline="central" fill="#791F1F">WAITING_PERIOD</text>
<line x1="340" y1="282" x2="340" y2="312" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="354" y="300" fill="#5F5E5A">no</text>

<!-- Check 4 -->
<rect x="200" y="312" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="330" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">MRI/CT without pre-auth?</text>
<text font-size="12" x="340" y="346" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Always required for these scans</text>
<path d="M480 334 L556 334 L556 376" fill="none" stroke="#e24b4a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
<text font-size="11" x="516" y="326" text-anchor="middle" fill="#A32D2D">yes</text>
<rect x="512" y="376" width="148" height="36" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text font-size="11" x="586" y="394" text-anchor="middle" dominant-baseline="central" fill="#791F1F">PRE_AUTH_MISSING</text>
<line x1="340" y1="356" x2="340" y2="386" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="354" y="374" fill="#5F5E5A">no</text>

<!-- Check 5 -->
<rect x="200" y="386" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="404" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Fraud indicators?</text>
<text font-size="12" x="340" y="420" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">3+ claims same day · date mismatch</text>
<path d="M480 408 L556 408 L556 450" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
<text font-size="11" x="516" y="400" text-anchor="middle" fill="#185FA5">yes</text>
<rect x="512" y="450" width="148" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-size="11" x="586" y="468" text-anchor="middle" dominant-baseline="central" fill="#0C447C">MANUAL_REVIEW</text>
<line x1="340" y1="430" x2="340" y2="460" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="354" y="448" fill="#5F5E5A">no</text>

<!-- Check 6 -->
<rect x="200" y="460" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="478" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Any items excluded/over limit?</text>
<text font-size="12" x="340" y="494" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Mixed claim: some covered, some not</text>
<path d="M480 482 L556 482 L556 524" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
<text font-size="11" x="516" y="474" text-anchor="middle" fill="#BA7517">yes</text>
<rect x="512" y="524" width="148" height="36" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text font-size="11" x="586" y="542" text-anchor="middle" dominant-baseline="central" fill="#633806">PARTIAL approval</text>
<line x1="340" y1="504" x2="340" y2="534" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="354" y="522" fill="#5F5E5A">no</text>

<!-- Check 7 -->
<rect x="200" y="534" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="552" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Confidence score ≥ 0.70?</text>
<text font-size="12" x="340" y="568" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Low confidence → human review</text>
<path d="M200 556 L120 556 L120 600" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
<text font-size="11" x="158" y="548" text-anchor="middle" fill="#185FA5">no</text>
<rect x="52" y="600" width="136" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-size="11" x="120" y="618" text-anchor="middle" dominant-baseline="central" fill="#0C447C">MANUAL_REVIEW</text>
<line x1="340" y1="578" x2="340" y2="610" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="354" y="596" fill="#5F5E5A">yes</text>

<!-- APPROVED -->
<rect x="220" y="610" width="240" height="44" rx="22" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="632" text-anchor="middle" dominant-baseline="central" fill="#085041">APPROVED</text>

<!-- Python calc -->
<line x1="340" y1="654" x2="340" y2="684" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="180" y="684" width="320" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="702" text-anchor="middle" dominant-baseline="central" fill="#085041">Python overrides final amount</text>
<text font-size="12" x="340" y="718" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Cap → co-pay or network discount</text>
</svg>
