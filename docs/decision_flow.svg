<svg width="680" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif; background: white;">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#e24b4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- START -->
<rect x="240" y="20" width="200" height="40" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="40" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Claim received</text>
<line x1="340" y1="60" x2="340" y2="90" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Priority labels -->
<text font-size="11" x="40" y="113" fill="#bbb">P1</text>
<text font-size="11" x="40" y="187" fill="#bbb">P2</text>
<text font-size="11" x="40" y="261" fill="#bbb">P3</text>
<text font-size="11" x="40" y="335" fill="#bbb">P4</text>
<text font-size="11" x="40" y="409" fill="#bbb">P5</text>
<text font-size="11" x="40" y="483" fill="#bbb">P6</text>
<text font-size="11" x="40" y="557" fill="#bbb">P7</text>

<!-- Check 1 -->
<rect x="200" y="90" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="108" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Prescription present?</text>
<text font-size="12" x="340" y="124" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Doctor reg number visible</text>
<path d="M480 112 L556 112 L556 152" fill="none" stroke="#e24b4a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
<text font-size="11" x="516" y="104" text-anchor="middle" fill="#A32D2D">no</text>
<rect x="512" y="152" width="148" height="36" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text font-size="11" x="586" y="170" text-anchor="middle" dominant-baseline="central" fill="#791F1F">MISSING_DOCUMENTS</text>
<line x1="340" y1="134" x2="340" y2="164" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="354" y="152" fill="#5F5E5A">yes</text>

<!-- Check 2 -->
<rect x="200" y="164" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="182" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Treatment excluded?</text>
<text font-size="12" x="340" y="198" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Cosmetic, weight loss, LASIK…</text>
