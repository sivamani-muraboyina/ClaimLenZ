<svg width="680" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif; background: white;">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#e24b4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- User -->
<rect x="240" y="20" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#3C3489">User submits claim</text>

<line x1="340" y1="64" x2="340" y2="94" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Instant checks -->
<rect x="190" y="94" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="112" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Python instant checks</text>
<text font-size="12" x="340" y="130" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Amount &lt; ₹500 · Submission &gt; 30 days</text>

<path d="M190 122 L100 122" fill="none" stroke="#e24b4a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
<rect x="28" y="104" width="72" height="36" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text font-size="12" x="64" y="122" text-anchor="middle" dominant-baseline="central" fill="#791F1F">Rejected</text>
<text font-size="11" x="143" y="111" text-anchor="middle" fill="#A32D2D">fail</text>

<line x1="340" y1="150" x2="340" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="356" y="168" fill="#5F5E5A">pass</text>

<!-- pdfplumber -->
<rect x="190" y="180" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="198" text-anchor="middle" dominant-baseline="central" fill="#085041">pdfplumber text extraction</text>
<text font-size="12" x="340" y="216" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">PDF → raw text · images noted only</text>

<line x1="340" y1="236" x2="340" y2="266" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- AI pipeline border -->
<rect x="140" y="254" width="400" height="252" rx="12" fill="none" stroke="#ccc" stroke-width="0.5" stroke-dasharray="5 4"/>
<text font-size="11" x="544" y="272" text-anchor="end" fill="#aaa">AI pipeline</text>

<!-- Groq Stage 1 -->
<rect x="160" y="266" width="360" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="284" text-anchor="middle" dominant-baseline="central" fill="#633806">Groq · Llama 3.3 70B — Stage 1</text>
<text font-size="12" x="340" y="302" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Extract: doctor, diagnosis, medicines, amount</text>

<line x1="340" y1="322" x2="340" y2="352" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Doctor reg -->
<rect x="190" y="352" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="370" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Python · doctor reg validation</text>
<text font-size="12" x="340" y="388" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Regex: KA/12345/2015 or AYUR/KL/…</text>

<line x1="340" y1="408" x2="340" y2="438" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Groq Stage 2 -->
<rect x="160" y="438" width="360" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="456" text-anchor="middle" dominant-baseline="central" fill="#633806">Groq · Llama 3.3 70B — Stage 2</text>
<text font-size="12" x="340" y="474" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Adjudicate: 10+ rules in priority order</text>

<line x1="340" y1="494" x2="340" y2="524" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Final calc -->
<rect x="190" y="524" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="542" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Python · final amount calculation</text>
<text font-size="12" x="340" y="560" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Cap ₹5k → network discount / co-pay</text>
</svg>
